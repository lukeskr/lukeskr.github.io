---
layout: compress
---

{% include base_path %}

<!doctype html>
<html lang="{{ site.locale | slice: 0,2 }}" class="no-js"{% if site.site_theme == "dark" %} data-theme="dark"{% endif %}>
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>

  <body>

    {% include browser-upgrade.html %}
    {% include masthead.html %}

    {{ content }}

    <div class="page__footer">
      <details class="page__footer-collapse" open>
        <summary class="page__footer-toggle">
          <span class="page__footer-toggle-open">Hide footer</span>
          <span class="page__footer-toggle-closed">Show footer</span>
          <i class="fa-solid fa-chevron-down" aria-hidden="true"></i>
        </summary>
        <footer>
          {% include footer/custom.html %}
          {% include footer.html %}
        </footer>
      </details>
    </div>

    {% include scripts.html %}

  </body>
</html>
